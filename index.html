<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Lelek Studio — Objects shaped by earth</title>
<meta name="description" content="Lelek Studio Berlin — handmade stoneware objects, vessels and wall pieces by ceramist Przemyslaw Golebiewski. Studio designing objects for contemporary interiors."/>
<link rel="canonical" href="https://www.lelekstudio.com"/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://www.lelekstudio.com"/>
<meta property="og:title" content="Lelek Studio — Earth is the author"/>
<meta property="og:description" content="Handmade stoneware objects from Berlin. Guided by instinct, shaped by earth."/>
<meta property="og:image" content="https://www.lelekstudio.com/images/og-image.png"/>
<meta name="robots" content="index,follow"/>
<meta name="theme-color" content="#F4F1EA"/>
<link rel="stylesheet" href="/css/monolith.css"/>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "name": "Lelek Studio",
  "url": "https://www.lelekstudio.com",
  "logo": "https://www.lelekstudio.com/images/og-image.png",
  "description": "Handmade stoneware objects, vessels and wall pieces from Berlin.",
  "address": {
    "@type": "PostalAddress",
    "addressLocality": "Berlin",
    "addressCountry": "DE"
  },
  "sameAs": [
    "https://www.instagram.com/lelek.studio.berlin/",
    "https://www.etsy.com/shop/LelekStudio"
  ]
}
</script>
</head>
<body>

<div class="grid-seams" aria-hidden="true"></div>

<nav class="site-nav" id="nav" aria-label="Primary">
  <a href="#">Lelek Studio</a>
  <a href="#" id="navShop" target="_blank" rel="noopener noreferrer">Shop ↗</a>
</nav>

<main id="app" class="scroll-canvas">
  <div class="loading-screen">Loading...</div>
</main>

<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (s) =>
    String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");

  function img(src, alt) {
    return (
      '<img src="' +
      esc(src) +
      '" alt="' +
      esc(alt) +
      '" loading="lazy" decoding="async" onerror="this.style.opacity=0"/>'
    );
  }

  function renderProduct(p) {
    const align = p.align || "left";
    return (
      '<article class="block-exhibit" aria-labelledby="prod-' +
      esc(p.catalog) +
      '">' +
      '<div class="cat-num exhibit-num">' +
      esc(p.catalog) +
      "</div>" +
      '<div class="exhibit-frame align-' +
      esc(align) +
      '">' +
      '<div class="exhibit-inner" data-speed="0.15">' +
      img(p.image, p.alt) +
      "</div>" +
      '<span class="exhibit-hover-tag">Open →</span>' +
      "</div>" +
      '<div class="exhibit-caption align-' +
      esc(align) +
      '">' +
      '<h2 class="caption-title" id="prod-' +
      esc(p.catalog) +
      '">' +
      esc(p.title) +
      "</h2>" +
      '<div class="caption-meta">' +
      "<span>" +
      esc(p.material) +
      "</span>" +
      "<span>" +
      esc(p.process) +
      "</span>" +
      "<span>" +
      esc(p.year) +
      "</span>" +
      "<span>" +
      esc(p.availability) +
      "</span>" +
      "</div>" +
      "</div>" +
      "</article>"
    );
  }

  function renderInterior(i) {
    const align = i.align || "right";
    return (
      '<article class="block-interior">' +
      '<div class="cat-num interior-num">' +
      esc(i.catalog) +
      "</div>" +
      '<div class="interior-frame align-' +
      esc(align) +
      '">' +
      '<div class="exhibit-inner" data-speed="0.12">' +
      img(i.image, i.alt) +
      "</div>" +
      "</div>" +
      '<div class="interior-caption align-' +
      esc(align) +
      '">' +
      '<h3 class="caption-title">' +
      esc(i.title) +
      "</h3>" +
      '<div class="caption-meta">' +
      "<span>" +
      esc(i.context) +
      "</span>" +
      "<span>" +
      esc(i.location) +
      "</span>" +
      "</div>" +
      "</div>" +
      "</article>"
    );
  }

  function render(data) {
    const s = data.site;
    const m = data.manifest;
    const q = data.quote;
    const shop = data.shop;
    const iv = data.intervention;
    const ct = data.contact;
    const ft = data.footer;

    document.title = s.name + " — " + s.tagline;
    $('meta[name="description"]').setAttribute("content", s.description);

    $("#navShop").href = shop.url;

    const manifestLines = m.lines
      .map(function (line, idx) {
        const cls = idx === m.lines.length - 1 ? "" : idx === 2 ? ' class="indent"' : "";
        return "<span" + cls + ">" + esc(line) + "</span>";
      })
      .join("");

    const voidLines = iv.lines
      .map(function (line, idx) {
        const cls = idx === 1 ? ' class="indent"' : "";
        return "<span" + cls + ">" + esc(line) + "</span>";
      })
      .join("");

    const contactLines = ct.headline
      .map(function (line) {
        return "<span>" + esc(line) + "</span>";
      })
      .join("");

    const footerWords = ft.words
      .map(function (w) {
        return "<span>" + esc(w) + "</span>";
      })
      .join("");

    $("#app").innerHTML =
      '<header class="block-manifest">' +
      '<div class="cat-num manifest-num">001</div>' +
      '<h1 class="manifest-title">' +
      manifestLines +
      "</h1>" +
      '<p class="manifest-sub">' +
      esc(m.sub) +
      "</p>" +
      "</header>" +

      '<section class="block-quote" aria-label="Quote">' +
      '<div class="cat-num">' +
      esc(q.catalog) +
      "</div>" +
      '<blockquote class="quote-text" data-speed="-0.08">' +
      esc(q.text) +
      "</blockquote>" +
      "</section>" +

      data.products.map(renderProduct).join("") +

      '<section class="block-shop" aria-label="Shop">' +
      '<a class="shop-link" href="' +
      esc(shop.url) +
      '" target="_blank" rel="noopener noreferrer">' +
      esc(shop.label) +
      " ↗</a>" +
      '<p class="shop-note">' +
      esc(shop.note) +
      "</p>" +
      "</section>" +

      '<section class="block-void" aria-label="Intervention">' +
      '<div class="cat-num">' +
      esc(iv.catalog) +
      "</div>" +
      '<h2 class="void-title">' +
      voidLines +
      "</h2>" +
      "</section>" +

      data.interiors.map(renderInterior).join("") +

      '<section class="block-contact" aria-label="Contact">' +
      '<div class="cat-num contact-num">' +
      esc(ct.catalog) +
      "</div>" +
      '<h2 class="contact-headline">' +
      contactLines +
      "</h2>" +
      '<p class="contact-sub">' +
      esc(ct.sub) +
      "</p>" +
      '<a class="contact-email" href="mailto:' +
      esc(s.email) +
      '">' +
      esc(ct.cta) +
      "</a>" +
      '<p class="contact-note">' +
      esc(ct.note) +
      "</p>" +
      "</section>" +

      '<footer class="site-footer">' +
      '<div class="footer-words">' +
      footerWords +
      "</div>" +
      '<div class="footer-since">' +
      esc(ft.since) +
      "</div>" +
      '<div class="footer-links">' +
      '<a href="' +
      esc(s.instagram) +
      '" target="_blank" rel="noopener noreferrer">' +
      esc(s.instagramHandle) +
      "</a>" +
      '<a href="' +
      esc(shop.url) +
      '" target="_blank" rel="noopener noreferrer">Etsy</a>' +
      '<a href="' +
      esc(s.artistUrl) +
      '" target="_blank" rel="noopener noreferrer">Przemyslaw Golebiewski</a>' +
      "</div>" +
      "</footer>";

    initScrollOffset();
  }

  function initScrollOffset() {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

    const layers = document.querySelectorAll("[data-speed]");
    if (!layers.length) return;

    let ticking = false;

    function update() {
      const scrollY = window.scrollY;
      layers.forEach(function (el) {
        const speed = parseFloat(el.getAttribute("data-speed"));
        const rect = el.getBoundingClientRect();
        const center = rect.top + rect.height / 2;
        const offset = (center - window.innerHeight / 2) * speed;
        el.style.transform = "translateY(" + offset + "px)";
      });
      ticking = false;
    }

    window.addEventListener(
      "scroll",
      function () {
        if (!ticking) {
          ticking = true;
          requestAnimationFrame(update);
        }
      },
      { passive: true }
    );
    update();
  }

  fetch("/data/content.json")
    .then(function (r) {
      if (!r.ok) throw new Error(r.status);
      return r.json();
    })
    .then(render)
    .catch(function () {
      $("#app").innerHTML =
        '<p class="err-msg">Could not load site content. Check that data/content.json is available.</p>';
    });
})();
</script>
</body>
</html>
